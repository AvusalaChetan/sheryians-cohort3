<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>producitivity dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body data-theme="light">
    <div class="c min-h-screen w-screen">
      <header class="border py-3 px-6 rounded-3xl">
        <nav class="flex items-center justify-between">
          <h2 class="text-2xl capitalize">productivity dashboard</h2>
          <div class="flex gap-2">
            <button class="nav-btn" id="theme">
              <i class="ri-sun-line"></i>
            </button>
            <a href="https://github.com/AvusalaChetan" class="nav-btn"
              ><i class="ri-github-fill"></i
            ></a>
          </div>
        </nav>
      </header>

      <!-- <div class="toast-success">adsfadsfasdf</div> -->

      <main>
        <div class="mainCon">
          <div
            id="display-panel"
            class="glass-panel flex min-h-[360px] flex-col justify-between md:mx-auto sm:mx-auto gap-8 px-6 py-7 sm:px-8 sm:py-8"
          >
            <div id="timeDeatils" class="flex flex-col gap-3">
              <p id="date" class="text-sm uppercase tracking-[0.32em]"></p>
              <h1 class="text-4xl font-semibold sm:text-5xl" id="day"></h1>
              <h3 id="place" class="text-xl capitalize sm:text-2xl">
                hyderabad
              </h3>
            </div>
            <div class="grid gap-3 sm:grid-cols-2">
              <div class="glass-chip">
                <h4
                  class="mt-1 text-4xl font-semibold capitalize sm:text-5xl"
                  id="dec"
                ></h4>
              </div>
              <div class="glass-chip">
                <p id="temp" class="text-sm"></p>
                <p id="hum" class="text-sm"></p>
                <p id="press" class="text-sm"></p>
              </div>
            </div>
          </div>

          <aside
            class="glass-panel w-full h-40 flex items-center justify-between sm:px-4 md:h-40 md:w-full lg:h-full lg:w-40 lg:flex-col lg:justify-between gap-4"
          >
            <div
              id="imgContainer"
              class="w-30 h-30 rounded-full"
              data-selectSec="taskList"
            >
              <img src="./imgs/todo.jpg" alt="" loading="lazy" />
            </div>
            <div
              id="imgContainer"
              class="w-30 h-30 rounded-full"
              data-selectSec="dayPlan"
            >
              <img src="./imgs/dailyplain.png" alt="" loading="lazy" />
            </div>
            <div
              id="imgContainer"
              class="w-30 h-30 rounded-full"
              data-selectSec="motivation"
            >
              <img src="./imgs/motivation.jpg" alt="mot" loading="lazy" />
            </div>
            <div
              id="imgContainer"
              class="w-30 h-30 rounded-full"
              data-selectSec="timer"
            >
              <img src="./imgs/timer.jpg" alt="timer" loading="lazy" />
            </div>
            <div
              id="imgContainer"
              class="w-30 h-30 rounded-full"
              data-selectSec="goles"
            >
              <img
                src="./imgs/dailygloes.jpg"
                alt="goles"
                loading="lazy"
                class=""
              />
            </div>
          </aside>

          <section
            class="absolute flex items-center justify-center"
            id="motivationSec"
          >
            <div
              class="absolute right-2 top-10 right-10 text-center rounded-[10px] border w-[30px] h-[30px]"
            >
              <button id="close" class="close">x</button>
            </div>

            <div
              class="w-[80%] border flex flex-col justify-between gap-2 relative py-4"
            >
              <p
                class="py-4 px-2 bg-gray-400/50 w-fit capitalize font-semibold"
              >
                quote of the Day
              </p>
              <h3 id="quote" class="text-4xl text-center m-4 font-bold">
                Nothing In Life Is To Be Feared, It Is Only To Be Understood.
                Now Is The Time To Understand More, So That We May Fear Less.
              </h3>
              <div class="flex items-center justify-end">
                <p
                  id="author"
                  class="w-fit font-semibold bg-gray-400/50 text-end right-2 bottom-0 px-4 py-2"
                ></p>
              </div>
            </div>
          </section>
          <section id="timerSec">
            <div class="flex justify-around">
              <h3 class="text-4xl capitalize">study with me!</h3>
              <button id="close" class="close">x</button>
            </div>
            <div
              class="border h-[90%] mt-6 flex flex-col justify-center gap-8 items-center"
            >
              <div
                class="flex flex-col items-center justify-center space-y-2 my-6"
              >
                <span
                  class="px-3 py-1 text-xs font-semibold tracking-wider uppercase rounded-full bg-[var(--surface-strong)] text-[var(--muted)] border border-[var(--border)]"
                >
                  work session
                </span>

                <h2
                  class="text-7xl font-bold tracking-tighter text-[var(--text)] tabular-nums"
                  id="time"
                >
                  25:00
                </h2>
              </div>
              <div class="flex gap-5">
                <button
                  id="start"
                  class="activeTimeBtn px-5 py-2.5 rounded-xl font-semibold border transition-all duration-200 active:scale-95 text-white hover:bg-[var(--accent-strong)] border-[var(--accent-strong)] shadow-sm"
                >
                  start
                </button>

                <button
                  id="pause"
                  class="px-5 py-2.5 rounded-xl font-semibold border transition-all duration-200 active:scale-95 bg-[var(--surface)] text-[var(--text)] border-[var(--border)] hover:bg-[var(--surface-strong)]"
                >
                  pause
                </button>

                <button
                  id="reset"
                  class="px-5 py-2.5 rounded-xl font-semibold border transition-all duration-200 active:scale-95 bg-[var(--surface)] text-[var(--muted)] border-[var(--border)] hover:text-[var(--text)] hover:bg-[var(--surface-strong)]"
                >
                  restart
                </button>
              </div>
            </div>
          </section>

          <section id="FormSec">
            <div class="flex justify-around">
              <h3 class="text-4xl capitalize" id="formHeading">form heading</h3>
              <button id="close" class="close">x</button>
            </div>

            <div class="flex items-center justify-between mt-6 h-[90%] w-full">
              <aside class="w-[30%] sm:w-1/2 h-full p-4">
                <form id="form" class="border p-2 h-full">
                  <div>
                    <label for="title">title</label>
                    <input type="text" id="title" placeholder="" />
                  </div>
                  <div>
                    <label for="details">enter details</label>
                    <textarea name="details" id="details"></textarea>
                  </div>
                  <div class="checkboxCon">
                    <input type="checkbox" name="imp" id="imp" />
                    <label for="imp">mark as important!</label>
                  </div>

                  <button
                    type="submit"
                    id="submit"
                    class="px-5 py-2.5 rounded-xl font-semibold border transition-all duration-200 active:scale-95 bg-[var(--surface)] text-[var(--text)] hover:bg-[var(--surface-strong)]"
                  >
                    submit
                  </button>
                </form>
              </aside>
              <aside class="bg-(--surface-strong) w-[70%] h-full">
                <ul
                  id=""
                  class="border w-full h-full p-4 flex flex-col gap-4"
                ></ul>
              </aside>
            </div>
          </section>

          <section id="dayPlanSec" class="flex flex-col gap-[20px]">
            <div class="flex justify-around">
              <h3 class="text-4xl capitalize">
                Plan your Day to be more Productivity
              </h3>
              <button id="close" class="close">x</button>
            </div>
            <div
              class="flex items-center justify-end capitalize font-bold flex-row-reverse w-[20%]"
            >
              <span>do it 12 hr</span> <input type="checkbox" name="" id="12hr" />
            </div>
            <div
              class="bg-gray-400 w-full h-[90%] grid grid-cols-2 gap-4 p-4"
              id="dayPlanCon"
            ></div>
          </section>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
