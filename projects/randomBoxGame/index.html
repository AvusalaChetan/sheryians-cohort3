<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="gameOver">
        <h1>game over</h1>
        <button id="restart">restart</button>
      </div>
      <div class="container">
        <div class="timer-score">
          <p>timer <span class="timerN">0</span></p>
          <p>score <span class="scoreN">0</span></p>
        </div>
        <div id="board">
          <button class="box"></button>
        </div>
        <button id="save">run</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
